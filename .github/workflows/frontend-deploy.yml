name: Build & Deploy Frontend to Azure Web App

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

# Prevent concurrent builds from racing and deploying out-of-order bundles
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: 'app-skillhub-frontend'
  AZURE_CLIENT_ID: 'ac0d5ccf-2cdc-4e0e-80fb-9ecb3c860d57'
  AZURE_TENANT_ID: '44e3cf94-19c9-4e32-96c3-14f5bf01391a'
  AZURE_SUBSCRIPTION_ID: '81a9b607-84ed-41c1-b95e-f9e8961416c1'

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for passwordless Azure OIDC authentication

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js runtime with npm dependency caching
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Clean install dependencies and build production React bundle
      - name: Install dependencies and build React app
        run: |
          npm ci
          npm run build

      # 4. Authenticate to Azure via OpenID Connect (OIDC) using Managed Identity
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || env.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || env.AZURE_SUBSCRIPTION_ID }}

      # 5. Deploy production bundle to Azure Web App using active Azure login session
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./dist



